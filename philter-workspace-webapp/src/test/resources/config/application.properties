# Test-only overrides, on top of src/main/resources/application.properties (Spring Boot reads config/
# after the classpath root, so these win). Spring picks this up automatically when running under
# @SpringBootTest / @WebMvcTest, so the strict-mode SymmetricCipher (which now
# refuses to start without a base64-of-32-bytes key) has a deterministic key
# at test time. The bytes here are not secret — they exist only so that any
# test that loads a Spring context can wire SymmetricCipher cleanly.
philter-workspace.crypto.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Bootstrap admin password — DefaultUserLoader refuses to start without one
# (finding #7). The value here is meaningless: most @WebMvcTest contexts mock
# the user repository so the loader's run() is a no-op anyway, but the bean
# still has to construct cleanly.
philter-workspace.admin.initial-password=test-bootstrap-password-12345

# The one Philter. Nothing at this address answers; tests that call Philter stub it or start one.
philter-workspace.philter.url=http://philter.invalid:8080
philter-workspace.philter.api-key=sk_test_not_a_real_key

# The embedded full-text index, kept out of the source tree.
philter-workspace.search.index-dir=target/search-index-test
