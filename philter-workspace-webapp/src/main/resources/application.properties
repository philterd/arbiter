# HTTP server
server.port=8080
# Trust X-Forwarded-* only when the immediate upstream is on the configured
# trusted-proxies list (R2-F5). The "native" strategy hands the work to
# Tomcat's RemoteIpValve, which enforces a regex of acceptable upstream IPs.
# The previous "framework" strategy trusted X-Forwarded-For from any caller,
# which let a direct client rotate the header and pass a false address to
# Philter's sign-in rate limit and audit log.
#
# The default regex matches RFC1918 + loopback ranges, which covers the
# typical Docker bridge network where the app sits behind the host's reverse
# proxy. Production deployments behind a specific ingress/LB should narrow
# this further by setting PHILTER_WORKSPACE_TRUSTED_PROXIES_REGEX in the environment.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${PHILTER_WORKSPACE_TRUSTED_PROXIES_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|::1|fe80::.*}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Session cookie hardening (HTTPS-only, no cross-site sends).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Upload ceiling. Per-request limit is configurable under Admin → General.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Database: mongodb (default) or sqlite. Set PHILTER_WORKSPACE_STORE to choose.
philter-workspace.store=mongodb

# SQLite (philter-workspace.store=sqlite). A single-node store; keep the file on local disk, not a
# network file system. synchronous=FULL makes each commit durable across power loss.
philter-workspace.sqlite.path=./data/philter-workspace.db
philter-workspace.sqlite.pool-size=8
philter-workspace.sqlite.busy-timeout-ms=30000
philter-workspace.sqlite.synchronous=FULL

# The one Philter that Philter Workspace uses for sign-in, policies, and redaction (PHILTER_WORKSPACE_PHILTER_URL), and the
# API key background work such as ingest uses (PHILTER_WORKSPACE_PHILTER_API_KEY), for a Philter user who is
# not an administrator. Both are required; set the key through the environment.
philter-workspace.philter.url=
philter-workspace.philter.api-key=

# TLS for an https:// Philter. A trust store for a private certificate authority, and
# a client certificate for mutual TLS; both optional. Set passwords through the environment.
philter-workspace.philter.tls.trust-store=
philter-workspace.philter.tls.trust-store-password=
philter-workspace.philter.tls.key-store=
philter-workspace.philter.tls.key-store-password=

# MongoDB (philter-workspace.store=mongodb)
spring.data.mongodb.uri=mongodb://localhost:27017/philter-workspace
# Create the @Indexed / @CompoundIndex indexes on startup.
spring.data.mongodb.auto-index-creation=true

# Sessions in Valkey (Redis protocol). Comment out store-type for in-memory fallback.
spring.session.store-type=redis
spring.session.timeout=30m
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Use JVM virtual threads for request handling.
spring.threads.virtual.enabled=true

# Demo data is OFF by default (R2-F4). A fresh production install must not silently
# load synthetic PII-shaped records into an empty Mongo where they would sit
# alongside real data and be indistinguishable in the audit log. The dev
# docker-compose.yaml flips this on; the prod compose leaves it off.
philter-workspace.demo-data.enabled=false
philter-workspace.demo-data.directory=/app/sample-files

# OpenAPI / Swagger UI is disabled by default (R2-F2). When enabled, the routes
# are also gated to ROLE_ADMIN in SecurityConfig — flip via env on demand:
#   PHILTER_WORKSPACE_OPENAPI_ENABLED=true
# Never enable on a production deployment unless OpenAPI is actively in use.
springdoc.api-docs.enabled=${PHILTER_WORKSPACE_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${PHILTER_WORKSPACE_OPENAPI_ENABLED:false}

# Error-page hardening (R2-F16). These match Spring Boot's current defaults;
# pinning them explicitly makes drift surveyable — an accidental future
# profile override (`--debug`, `?trace=true`, an ops fix-it ticket flipping
# include-message=always) is now a single-line diff that a code review can
# catch, rather than a quiet platform behaviour change that lets PII leak
# out through 4xx/5xx response bodies.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Pin Thymeleaf caching on (R2-F17). Default in Spring Boot is true when
# devtools is absent — which is the case for production. Adding devtools to
# the runtime image (a common ops mistake) would otherwise silently flip the
# cache off and disable HTTP cache headers on every template response.
spring.thymeleaf.cache=true

# Actuator. Only health and prometheus are exposed; everything else answers 404. Both
# are unauthenticated, so keep the port internal or block /actuator at the proxy.
management.endpoints.web.exposure.include=health,prometheus
# No /actuator links page: nothing consumes it.
management.endpoints.web.discovery.enabled=false
# No per-component detail to unauthenticated callers. Pinned so an override that would
# disclose the Mongo URI or OpenSearch endpoint is a visible diff.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Valkey holds sessions and cannot be switched off in Boot 3, so an unreachable Valkey
# means Philter Workspace cannot serve a page. Health says so.
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
