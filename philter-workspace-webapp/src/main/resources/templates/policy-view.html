<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="|Philter Workspace - Policy|">Philter Workspace - Policies</title>
    <script th:nonce="${cspNonce}" th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside th:replace="~{fragments/policy-sidebar :: sidebar}"></aside>
        <div class="flex-1 flex flex-col min-w-0">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main class="flex-1 p-8 max-w-5xl">
            <a th:href="@{/policies}" class="text-sm text-blue-600 hover:text-blue-800">Back to policies</a>
            <h2 class="mt-2 text-3xl font-bold text-gray-900" th:text="${revision != null} ? |${name}, revision ${revision}| : ${name}">policy</h2>
            <p th:if="${owner != null}" class="mt-1 text-sm text-gray-600">Owner: <span class="font-medium" th:text="${owner}">jdoe</span></p>

            <pre class="mt-4 text-xs font-mono bg-white border border-gray-200 rounded-lg p-4 overflow-auto whitespace-pre-wrap break-words"
                 th:text="${json}">{}</pre>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script th:replace="~{fragments/scripts :: philter-ui}"></script>
</body>
</html>
