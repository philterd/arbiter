<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Philter Workspace - Custom List</title>
    <script th:nonce="${cspNonce}" th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside th:replace="~{fragments/policy-sidebar :: sidebar}"></aside>
        <div class="flex-1 flex flex-col min-w-0">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main class="flex-1 p-8 max-w-5xl">
            <a th:href="@{${backUrl}}" class="text-sm text-blue-600 hover:text-blue-800">Back to custom lists</a>
            <h2 class="mt-2 text-3xl font-bold text-gray-900"
                th:text="${!form.existing()} ? 'New custom list' : (${canWrite} ? |Edit ${form.name()}| : ${form.name()})">New custom list</h2>
            <p th:if="${form.owner() != null}" class="mt-1 text-sm text-gray-600">Owner: <span class="font-medium" th:text="${form.owner()}">jdoe</span></p>
            <p th:if="${form.existing()}" class="mt-1 text-sm text-gray-600">Policies refer to it as
                <code th:text="|list:${form.name()}|">list:name</code>.</p>

            <div class="mt-4" th:replace="~{fragments/forms :: errors(${errors})}"></div>

            <form th:action="${form.existing()} ? @{/policies/lists/edit} : @{/policies/lists/new}" method="post" class="mt-4 space-y-4">
                <input th:if="${form.owner() != null}" type="hidden" name="owner" th:value="${form.owner()}">
                <th:block th:if="${form.existing()}">
                    <input type="hidden" name="name" th:value="${form.name()}">
                    <input type="hidden" name="originalDescription" th:value="${form.originalDescription()}">
                </th:block>
                <div th:unless="${form.existing()}">
                    <label for="name" class="block text-xs font-medium text-gray-600 mb-1">Name</label>
                    <input id="name" name="name" type="text" required maxlength="200" autocomplete="off"
                           autocapitalize="none" spellcheck="false" th:value="${form.name()}"
                           th:attr="aria-describedby=${errors != null and errors.has('name')} ? 'name-error' : 'name-help'"
                           class="block w-full max-w-md rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p id="name-help" class="mt-1 text-xs text-gray-500">A list cannot be renamed. A name cannot contain
                        /, \, ;, or %.</p>
                    <p th:replace="~{fragments/forms :: field-error(${errors}, 'name')}"></p>
                </div>
                <div>
                    <label for="description" class="block text-xs font-medium text-gray-600 mb-1">
                        Description <span class="text-gray-400 font-normal">(optional)</span></label>
                    <input id="description" name="description" type="text" th:maxlength="${maximumDescriptionLength}"
                           th:value="${form.description()}" th:readonly="${!canWrite}"
                           th:attr="aria-describedby=${errors != null and errors.has('description')} ? 'description-error' : null"
                           class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p th:replace="~{fragments/forms :: field-error(${errors}, 'description')}"></p>
                </div>
                <div>
                    <label for="items" class="block text-xs font-medium text-gray-600 mb-1">Items, one per line</label>
                    <textarea id="items" name="items" rows="14" th:readonly="${!canWrite}" th:required="${canWrite}"
                              spellcheck="false" th:text="${form.items()}"
                              th:attr="aria-describedby=${errors != null and errors.has('items')} ? 'items-error' : 'items-help'"
                              class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <p id="items-help" class="mt-1 text-xs text-gray-500"
                       th:text="|Up to ${maximumItems} items of up to ${maximumItemLength} characters each. Blank lines are left out.|">help</p>
                    <p th:replace="~{fragments/forms :: field-error(${errors}, 'items')}"></p>
                </div>
                <div th:if="${canWrite}" class="flex items-center gap-4">
                    <button type="submit"
                            class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">Save</button>
                    <a th:href="@{${backUrl}}" class="text-sm text-blue-600 hover:text-blue-800">Cancel</a>
                </div>
            </form>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script th:replace="~{fragments/scripts :: philter-ui}"></script>
</body>
</html>
