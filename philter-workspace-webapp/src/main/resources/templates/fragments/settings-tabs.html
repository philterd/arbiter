<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- The Settings page's tabs; activeTab names the selected one. -->
    <div th:fragment="tabs(activeTab)" class="border-b border-gray-200 mb-6">
        <nav class="-mb-px flex flex-wrap gap-x-6">
            <a th:href="@{/settings}" th:attr="aria-current=${activeTab == 'account'} ? 'page' : null"
               th:classappend="${activeTab == 'account'} ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
               class="whitespace-nowrap px-1 py-3 border-b-2 text-sm font-medium">
                Account
            </a>
            <a th:href="@{/settings/api-keys}" th:attr="aria-current=${activeTab == 'api-keys'} ? 'page' : null"
               th:classappend="${activeTab == 'api-keys'} ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
               class="whitespace-nowrap px-1 py-3 border-b-2 text-sm font-medium">
                API Keys
            </a>
            <a th:href="@{/settings/webhook}" th:attr="aria-current=${activeTab == 'webhook'} ? 'page' : null"
               th:classappend="${activeTab == 'webhook'} ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
               class="whitespace-nowrap px-1 py-3 border-b-2 text-sm font-medium">
                Webhook
            </a>
        </nav>
    </div>
</body>
</html>
