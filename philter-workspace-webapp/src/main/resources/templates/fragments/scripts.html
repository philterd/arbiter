<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
        The script behind the confirm and json-editor fragments, and secret generation. Include it once, at the bottom of the
        page. It carries the request's CSP nonce and binds with addEventListener, since the CSP refuses
        inline event handlers. Without it the pages still work: confirm links open the confirm page, and
        JSON is checked when the form is submitted.
    -->
    <script th:fragment="philter-ui" th:nonce="${cspNonce}">
        (function () {
            document.querySelectorAll('[data-confirm-dialog]').forEach(function (link) {
                var dialog = document.getElementById(link.getAttribute('data-confirm-dialog'));
                if (!dialog || typeof dialog.showModal !== 'function') {
                    return;
                }
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    dialog.showModal();
                });
            });
            document.querySelectorAll('textarea[data-json-editor]').forEach(function (area) {
                var message = document.getElementById(area.getAttribute('data-json-message'));
                var check = function () {
                    var problem = '';
                    try {
                        var value = JSON.parse(area.value);
                        if (value === null || typeof value !== 'object' || Array.isArray(value)) {
                            problem = 'Enter a JSON object, starting with {.';
                        }
                    } catch (e) {
                        // The browser's message can quote the text, so it is not shown.
                        problem = 'This is not valid JSON.';
                    }
                    if (message) {
                        message.textContent = problem;
                    }
                    area.setAttribute('aria-invalid', problem ? 'true' : 'false');
                };
                area.addEventListener('input', check);
            });
            // A button that fills a field with a random secret, as for a webhook. Hidden without JavaScript.
            document.querySelectorAll('button[data-generate-secret]').forEach(function (button) {
                var field = document.getElementById(button.getAttribute('data-generate-secret'));
                if (!field || !window.crypto || !window.crypto.getRandomValues) {
                    return;
                }
                button.hidden = false;
                button.addEventListener('click', function () {
                    var characters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
                    var values = new Uint32Array(32);
                    window.crypto.getRandomValues(values);
                    var secret = '';
                    for (var i = 0; i < values.length; i++) {
                        secret += characters.charAt(values[i] % characters.length);
                    }
                    field.type = 'text';
                    field.value = secret;
                    field.focus();
                    field.select();
                });
            });
        })();
    </script>
</body>
</html>
