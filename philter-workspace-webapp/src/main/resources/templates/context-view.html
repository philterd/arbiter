<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Philter Workspace - Context</title>
    <script th:nonce="${cspNonce}" th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside th:replace="~{fragments/policy-sidebar :: sidebar}"></aside>
        <div class="flex-1 flex flex-col min-w-0">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <main class="flex-1 p-8 max-w-3xl">
            <a th:href="@{${backUrl}}" class="text-sm text-blue-600 hover:text-blue-800">Back to contexts</a>
            <h2 class="mt-2 text-3xl font-bold text-gray-900 break-words" th:text="${name}">default</h2>
            <p th:if="${owner != null}" class="mt-1 text-sm text-gray-600">Owner: <span class="font-medium" th:text="${owner}">jdoe</span></p>
            <p class="mt-1 text-sm text-gray-600" th:text="${settings}">No disambiguation</p>

            <div th:if="${canWrite}" class="mt-4 flex flex-wrap items-center gap-4 text-sm">
                <a th:href="@{${editUrl}}" class="font-medium text-blue-600 hover:text-blue-800">Edit settings</a>
                <th:block th:replace="~{fragments/confirm :: confirm('clear', ${clearing}, 'Clear', 'font-medium text-red-600 hover:text-red-800')}"></th:block>
                <th:block th:replace="~{fragments/confirm :: confirm('delete', ${deletion}, 'Delete', 'font-medium text-red-600 hover:text-red-800')}"></th:block>
            </div>

            <h3 class="mt-8 text-lg font-semibold text-gray-900"
                th:text="${details.size == 1} ? '1 entry' : |${details.size} entries|">12 entries</h3>
            <p th:if="${details.size == 0}" class="mt-1 text-sm text-gray-600">This context holds no
                replacements.</p>
            <div th:unless="${details.size == 0}" class="mt-3 bg-white rounded-lg border border-gray-200 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <caption class="sr-only">Entries by filter type</caption>
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Filter type</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Entries</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr th:each="c : ${counts}">
                            <td class="px-6 py-3 text-sm text-gray-900" th:text="${c.key}">email-address</td>
                            <td class="px-6 py-3 text-sm text-gray-700 text-right" th:text="${c.value}">3</td>
                        </tr>
                        <tr th:if="${details.untyped > 0}">
                            <td class="px-6 py-3 text-sm text-gray-600 italic">No filter type</td>
                            <td class="px-6 py-3 text-sm text-gray-700 text-right" th:text="${details.untyped}">1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>
    <script th:replace="~{fragments/scripts :: philter-ui}"></script>
</body>
</html>
