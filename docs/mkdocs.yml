site_name: Philter Workspace
repo_url: https://github.com/philterd/philter-workspace
site_url: https://philterd.github.io/philter-workspace/
edit_uri: '?query=docs/docs/'
copyright: Copyright 2026 Philterd, LLC.
site_author: philterd
site_description: User guide for Philter Workspace, the human-in-the-loop deidentification tool.
theme:
  name: material
  locale: en
  palette:
    primary: red
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Workflow: workflow.md
  - User guide:
      - Queue: user-guide/queue.md
      - Adding documents: user-guide/uploading.md
      - Background jobs: user-guide/background-jobs.md
      - Reviewing: user-guide/reviewing.md
      - Personal settings: user-guide/settings.md
  - Admin guide:
      - Users and groups: admin/users-and-groups.md
      - Batches: admin/batches.md
      - Approval rule sets: admin/rules.md
      - Data sources: admin/data-sources.md
      - Destinations: admin/destinations.md
      - Exporting annotations: admin/exporting.md
      - Audit log: admin/audit-log.md
      - Legal holds: admin/legal-holds.md
      - Ledgers: admin/ledgers.md
      - Philter settings: admin/philter-settings.md
      - Reports: admin/reports.md
      - Full text search: admin/full-text-search.md
      - Notifications: admin/notifications.md
      - Security: admin/security.md
      - Tools: admin/tools.md
  - Reference:
      - Risk score: reference/risk-score.md
      - PII types: reference/pii-types.md
      - REST API: reference/api.md
