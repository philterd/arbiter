# Test-only overrides. Spring picks this up automatically when running under
# @SpringBootTest / @WebMvcTest, so the strict-mode SymmetricCipher (which now
# refuses to start without a base64-of-32-bytes key) has a deterministic key
# at test time. The bytes here are not secret — they exist only so that any
# test that loads a Spring context can wire SymmetricCipher cleanly.
arbiter.crypto.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
