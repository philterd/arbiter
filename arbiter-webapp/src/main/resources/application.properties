# HTTP server
server.port=8080
# Trust X-Forwarded-* from a TLS-terminating reverse proxy.
server.forward-headers-strategy=framework

# Session cookie hardening (HTTPS-only, no cross-site sends).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Upload ceiling. Per-request limit is configurable under Admin → General.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/arbiter
# Auto-create @Indexed / @CompoundIndex indexes on first use.
spring.data.mongodb.auto-index-creation=true

# Sessions in Valkey (Redis protocol). Comment out store-type for in-memory fallback.
spring.session.store-type=redis
spring.session.timeout=30m
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Use JVM virtual threads for request handling.
spring.threads.virtual.enabled=true

# Demo data (loaded on first startup when collections are empty).
arbiter.demo-data.enabled=true
arbiter.demo-data.directory=/app/sample-files
