server.port=8080

# Trust X-Forwarded-* headers from a TLS-terminating reverse proxy so that
# Spring sees the original scheme (https) and can set Secure on the session
# cookie correctly. "framework" mode validates the forwarded host/port against
# a configurable allow-list (all origins by default) which is safe behind a
# single well-controlled proxy.
server.forward-headers-strategy=framework

# Session cookie hardening.
# - HttpOnly: already the servlet default but set explicitly for clarity.
# - Secure:   instructs the browser to send the cookie only over HTTPS.
#             Works correctly even when Spring receives plain HTTP from a proxy
#             because forward-headers-strategy=framework above makes Spring
#             believe the request arrived over HTTPS.
# - SameSite=Strict: browser will not send the cookie on any cross-site
#             request, eliminating the CSRF vector that a missing SameSite
#             attribute would otherwise leave open.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Hard ceiling at the framework layer. The runtime-configurable limit lives under
# Admin → General and is enforced per-request in RedactionController/IngestionController;
# this property only kicks in if the admin bumps that limit higher than the ceiling.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/arbiter

# Session state lives in Valkey (Redis protocol-compatible) so HTTP sessions are
# shared across replicas. docker-compose overrides spring.data.redis.host via env.
# When Valkey is not reachable on local non-Docker runs, comment out
# spring.session.store-type to fall back to in-memory sessions.
spring.session.store-type=redis
spring.session.timeout=30m
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Auto-create indexes declared via @Indexed / @CompoundIndex on first repository
# access. We rely on this for the unique-name constraints (User, Batch, …) and
# the partial unique "one in-flight data-import job per batch" index on
# BackgroundJob. Spring Boot 3.x defaults this to false.
spring.data.mongodb.auto-index-creation=true

# Server port
spring.threads.virtual.enabled=true

# Philter instances are managed at runtime under Admin → Philter. When no default
# instance is configured there, Arbiter falls back to its bundled local Phileas library.

# Ingest the files under the configured directory on startup, when the
# batches/documents/spans collections are empty. Each file is run through the
# redaction service to produce real spans for the demo.
# The default points at the path mounted by docker-compose.yaml. When this
# directory does not exist (e.g. running locally outside Docker), the loader
# falls back to ./sample-files and ../sample-files relative to the working dir.
arbiter.demo-data.enabled=true
arbiter.demo-data.directory=/app/sample-files
