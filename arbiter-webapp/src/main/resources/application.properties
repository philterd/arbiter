server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/arbiter

# Server port
spring.threads.virtual.enabled=true

# Philter instances are managed at runtime under Admin → Philter. When no default
# instance is configured there, Arbiter falls back to its bundled local Phileas library.

# Ingest the files under the configured directory on startup, when the
# batches/documents/spans collections are empty. Each file is run through the
# redaction service to produce real spans for the demo.
# The default points at the path mounted by docker-compose.yaml. When this
# directory does not exist (e.g. running locally outside Docker), the loader
# falls back to ./sample-files and ../sample-files relative to the working dir.
arbiter.demo-data.enabled=true
arbiter.demo-data.directory=/app/sample-files
