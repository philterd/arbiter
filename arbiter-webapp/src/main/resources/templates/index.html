<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Upload Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="px-6 py-5 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">Arbiter</h1>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a th:href="@{/}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                    </svg>
                    Queue
                </a>
                <a th:href="@{/upload}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md bg-blue-50 text-blue-700">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5m0 0l5 5m-5-5v12"></path>
                    </svg>
                    Upload
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-gray-200 text-sm text-gray-600">
                <div class="px-3 mb-2">Signed in as <span class="font-medium" sec:authentication="name">user</span></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full text-left px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100">
                        Sign out
                    </button>
                </form>
            </div>
        </aside>

        <main class="flex-1 p-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-6">Upload Document</h2>
            <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 max-w-2xl">
                <p class="text-gray-600 mb-6">Upload a document for redaction.</p>
                <form th:action="@{/redact}" method="post" enctype="multipart/form-data" class="space-y-6">
                    <div>
                        <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 p-2.5" type="file" name="file" id="fileInput" required>
                    </div>
                    <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition duration-200">
                        Redact Document
                    </button>
                </form>
                <div class="mt-8 text-sm text-gray-500">
                    <p>Supported formats: .txt, .pdf (searchable)</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
