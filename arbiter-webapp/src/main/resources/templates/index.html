<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Document Redaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card text-center">
            <h1 class="mb-4">Arbiter</h1>
            <p class="lead">Upload a document for redaction</p>
            <form th:action="@{/redact}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <input class="form-control" type="file" name="file" id="fileInput" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Redact Document</button>
            </form>
            <div class="mt-4 text-muted">
                <small>Supported formats: .txt, .pdf (searchable)</small>
            </div>
        </div>
    </div>
</body>
</html>
