<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Page not found</title>
    <script th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col items-center justify-center px-6 py-12">
        <a href="https://www.philterd.ai" target="_blank" rel="noopener" class="mb-8">
            <img th:src="@{/images/philterd.png}" alt="Philterd" class="h-10 opacity-80">
        </a>

        <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
            <p class="text-7xl font-bold text-blue-600 mb-2">404</p>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Page not found</h1>
            <p class="text-sm text-gray-600 mb-6">
                The page you are looking for does not exist or may have been moved.
            </p>
            <a th:href="@{/}"
               class="inline-flex items-center px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200">
                <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Go to Dashboard
            </a>
        </div>

        <p class="mt-8 text-xs text-gray-400">Arbiter</p>
    </div>
</body>
</html>
