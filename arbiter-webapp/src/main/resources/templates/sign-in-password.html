<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Change Password</title>
    <script th:nonce="${cspNonce}" th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <a href="https://www.philterd.ai" target="_blank" rel="noopener"><img th:src="@{/images/philterd.png}" alt="Philterd" class="h-8 mx-auto mb-3"></a>
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">Arbiter</h1>
        <p class="text-sm text-gray-600 text-center mb-6">
            An administrator set your password. Choose a new one before you continue.
        </p>

        <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700"
             th:text="${error}">The password was not changed.</div>

        <form th:action="@{/sign-in/password}" method="post" class="space-y-4">
            <input type="text" name="username" th:value="${username}" autocomplete="username" hidden>
            <div>
                <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
                <input id="currentPassword" name="currentPassword" type="password" required autofocus
                       autocomplete="current-password"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
                <input id="newPassword" name="newPassword" type="password" required minlength="16"
                       autocomplete="new-password"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="mt-1 text-xs text-gray-500">At least 16 characters.</p>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm new password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="16"
                       autocomplete="new-password"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition duration-200">
                Change password
            </button>
        </form>
        <div class="mt-4 text-center">
            <a th:href="@{/login}" class="text-sm text-gray-500 hover:underline">Back to sign in</a>
        </div>
    </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
