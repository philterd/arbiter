<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Set Your Password</title>
    <script th:src="@{/js/tailwind.js}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <a href="https://www.philterd.ai" target="_blank" rel="noopener">
            <img th:src="@{/images/philterd.png}" alt="Philterd" class="h-8 mx-auto mb-3"></a>
        <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Set your password</h1>
        <p class="text-sm text-gray-600 text-center mb-6">
            Welcome to Arbiter
            <span th:if="${email}" class="font-medium text-gray-800" th:text="${email}">you@example.com</span>.
            Choose a password of at least 12 characters to finish setting up your account.
        </p>

        <div th:if="${error}"
             class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700"
             th:text="${error}">Error.</div>

        <form th:action="@{/invitations/{token}(token=${token})}" method="post" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
                <input id="password" name="password" type="password" required minlength="12" autofocus
                       autocomplete="new-password"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="12"
                       autocomplete="new-password"
                       class="block w-full rounded-lg border border-gray-300 p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition duration-200">
                Set password and sign in
            </button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
