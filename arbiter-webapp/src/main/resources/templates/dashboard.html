<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="px-6 py-5 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">Arbiter</h1>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a href="#" data-view="queue" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md bg-blue-50 text-blue-700">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                    </svg>
                    Queue
                </a>
                <a th:href="@{/upload}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5m0 0l5 5m-5-5v12"></path>
                    </svg>
                    Upload
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-gray-200 text-sm text-gray-600">
                <div class="px-3 mb-2">Signed in as <span class="font-medium" sec:authentication="name">user</span></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full text-left px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100">
                        Sign out
                    </button>
                </form>
            </div>
        </aside>

        <main class="flex-1 p-8">
            <div id="queue-view">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-gray-900">Review Queue</h2>
                    <button id="refreshBtn" class="px-4 py-2 border border-gray-300 text-gray-700 hover:bg-gray-100 font-medium rounded-lg transition duration-200">
                        Refresh
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Filename</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Batch</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Risk Score</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queueBody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between mt-4">
                    <span id="pageInfo" class="text-sm text-gray-600"></span>
                    <div class="flex space-x-2">
                        <button id="prevBtn" class="px-3 py-1.5 border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>Previous</button>
                        <button id="nextBtn" class="px-3 py-1.5 border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentPage = 0;
        const pageSize = 10;

        async function loadQueue(page) {
            const body = document.getElementById('queueBody');
            body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">Loading...</td></tr>';

            try {
                const response = await fetch(`/api/v1/queue?page=${page}&size=${pageSize}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                renderQueue(data);
            } catch (err) {
                body.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-red-600">Failed to load queue: ${escapeHtml(err.message)}</td></tr>`;
                document.getElementById('pageInfo').textContent = '';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
            }
        }

        function renderQueue(data) {
            const body = document.getElementById('queueBody');
            const docs = data.content || [];

            if (docs.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">No documents in the queue.</td></tr>';
            } else {
                body.innerHTML = docs.map(doc => `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHtml(doc.filename || '')}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(doc.batchId || '')}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass(doc.status)}">${escapeHtml(doc.status || '')}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${(doc.riskScore ?? 0).toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <a href="/review/${encodeURIComponent(doc.id)}" class="text-blue-600 hover:text-blue-800 font-medium">Review</a>
                        </td>
                    </tr>
                `).join('');
            }

            const totalPages = data.totalPages ?? 0;
            const number = data.number ?? 0;
            const totalElements = data.totalElements ?? 0;
            document.getElementById('pageInfo').textContent =
                totalElements === 0 ? '' : `Page ${number + 1} of ${totalPages} (${totalElements} document${totalElements === 1 ? '' : 's'})`;
            document.getElementById('prevBtn').disabled = number <= 0;
            document.getElementById('nextBtn').disabled = number >= totalPages - 1;
        }

        function statusClass(status) {
            switch (status) {
                case 'APPROVED':
                case 'COMPLETED': return 'bg-green-100 text-green-800';
                case 'REVIEW_REQUIRED': return 'bg-yellow-100 text-yellow-800';
                case 'PENDING': return 'bg-blue-100 text-blue-800';
                case 'REJECTED':
                case 'FAILED': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadQueue(currentPage);

            document.getElementById('refreshBtn').addEventListener('click', () => loadQueue(currentPage));
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadQueue(currentPage);
                }
            });
            document.getElementById('nextBtn').addEventListener('click', () => {
                currentPage++;
                loadQueue(currentPage);
            });
        });
    </script>
</body>
</html>
