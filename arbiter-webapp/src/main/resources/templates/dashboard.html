<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Arbiter - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="px-6 py-5 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">Arbiter</h1>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a th:href="@{/batches}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                    Batches
                </a>
                <a href="#" data-view="queue" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md bg-blue-50 text-blue-700">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                    </svg>
                    Queue
                </a>
                <a th:href="@{/upload}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5m0 0l5 5m-5-5v12"></path>
                    </svg>
                    Upload
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/reporting}" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18M9 17v-7m4 7v-12m4 12v-4"></path>
                    </svg>
                    Reporting
                </a>
                <a th:href="@{/settings}" class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Settings
                </a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}"
                   class="nav-link flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                    <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
                    </svg>
                    Admin
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-gray-200 text-sm text-gray-600">
                <div class="px-3 mb-2">
                    Signed in as <span class="font-medium" sec:authentication="name">user</span>
                    <span sec:authorize="hasRole('ADMIN')" class="ml-1 text-xs font-semibold uppercase tracking-wide bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">Admin</span>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="w-full text-left px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100">
                        Sign out
                    </button>
                </form>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
        <main class="flex-1 p-8">
            <div id="queue-view">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-gray-900">Queue</h2>
                    <div class="flex items-center gap-4">
                        <label sec:authorize="hasRole('ADMIN')" class="inline-flex items-center cursor-pointer text-sm text-gray-700">
                            <input id="myGroupsOnlyCb" type="checkbox" checked class="mr-2">
                            Limit to my groups
                        </label>
                        <button id="refreshBtn" class="px-4 py-2 border border-gray-300 text-gray-700 hover:bg-gray-100 font-medium rounded-lg transition duration-200">
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="flex flex-wrap items-end gap-3 mb-4">
                    <div>
                        <label for="batchFilter" class="block text-xs font-medium text-gray-600 mb-1 uppercase tracking-wide">Batch</label>
                        <select id="batchFilter" class="rounded-lg border border-gray-300 bg-white text-sm p-2 min-w-[12rem] focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">All batches</option>
                        </select>
                    </div>
                    <div>
                        <label for="statusFilter" class="block text-xs font-medium text-gray-600 mb-1 uppercase tracking-wide">Status</label>
                        <select id="statusFilter" class="rounded-lg border border-gray-300 bg-white text-sm p-2 min-w-[12rem] focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">All statuses</option>
                            <option value="PENDING">PENDING</option>
                            <option value="REVIEW_REQUIRED">REVIEW_REQUIRED</option>
                            <option value="AUDIT_REQUIRED">AUDIT_REQUIRED</option>
                            <option value="AUTO_APPROVED">AUTO_APPROVED</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="REJECTED">REJECTED</option>
                            <option value="FAILED">FAILED</option>
                        </select>
                    </div>
                    <button id="clearFiltersBtn" type="button" class="px-3 py-2 border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 rounded-lg">
                        Clear
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th data-sort="filename"
                                    class="sortable px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700">
                                    Filename <span class="sort-arrow"></span>
                                </th>
                                <th data-sort="batchId"
                                    class="sortable px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700">
                                    Batch <span class="sort-arrow"></span>
                                </th>
                                <th data-sort="status"
                                    class="sortable px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700">
                                    Status <span class="sort-arrow"></span>
                                </th>
                                <th data-sort="riskScore"
                                    class="sortable px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700">
                                    Risk Score <span class="sort-arrow"></span>
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queueBody" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between mt-4">
                    <span id="pageInfo" class="text-sm text-gray-600"></span>
                    <div class="flex space-x-2">
                        <button id="prevBtn" class="px-3 py-1.5 border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>Previous</button>
                        <button id="nextBtn" class="px-3 py-1.5 border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>Next</button>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script>
        let currentPage = 0;
        const pageSize = 10;
        let currentSort = 'riskScore';
        let currentDir = 'desc';
        const SORT_DEFAULT_DIR = { riskScore: 'desc', status: 'asc', batchId: 'asc', filename: 'asc' };

        function myGroupsOnlyValue() {
            const cb = document.getElementById('myGroupsOnlyCb');
            return cb ? String(cb.checked) : 'true';
        }

        function updateSortIndicators() {
            document.querySelectorAll('th.sortable').forEach(th => {
                const arrow = th.querySelector('.sort-arrow');
                if (!arrow) return;
                if (th.dataset.sort === currentSort) {
                    arrow.textContent = currentDir === 'asc' ? '▲' : '▼';
                    th.classList.add('text-gray-700');
                } else {
                    arrow.textContent = '';
                    th.classList.remove('text-gray-700');
                }
            });
        }

        async function loadQueue(page) {
            const body = document.getElementById('queueBody');
            body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">Loading...</td></tr>';

            const params = new URLSearchParams({ page, size: pageSize });
            const batchId = document.getElementById('batchFilter').value;
            const status = document.getElementById('statusFilter').value;
            if (batchId) params.set('batchId', batchId);
            if (status) params.set('status', status);
            params.set('myGroupsOnly', myGroupsOnlyValue());
            params.set('sort', currentSort);
            params.set('dir', currentDir);

            try {
                const response = await fetch(`/api/v1/queue?${params.toString()}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                renderQueue(data);
            } catch (err) {
                body.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-red-600">Failed to load queue: ${escapeHtml(err.message)}</td></tr>`;
                document.getElementById('pageInfo').textContent = '';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
            }
        }

        async function loadBatches() {
            const select = document.getElementById('batchFilter');
            const previousValue = select.value;
            select.innerHTML = '<option value="">All batches</option>';
            try {
                const params = new URLSearchParams({ myGroupsOnly: myGroupsOnlyValue() });
                const response = await fetch(`/api/v1/batches?${params.toString()}`);
                if (!response.ok) return;
                const batches = await response.json();
                for (const b of batches) {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.name;
                    select.appendChild(opt);
                }
                if (previousValue && batches.some(b => b.id === previousValue)) {
                    select.value = previousValue;
                }
            } catch (err) {
                // ignore — filter still works for status
            }
        }

        function renderQueue(data) {
            const body = document.getElementById('queueBody');
            const docs = data.content || [];

            if (docs.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">No documents in the queue.</td></tr>';
            } else {
                body.innerHTML = docs.map(doc => {
                    const displayStatus = doc.autoApproved ? 'AUTO_APPROVED' : (doc.status || '');
                    return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHtml(doc.filename || '')}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(doc.batchName || doc.batchId || '')}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass(displayStatus)}">${escapeHtml(displayStatus)}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${(doc.riskScore ?? 0).toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <a href="/review/${encodeURIComponent(doc.id)}" class="text-blue-600 hover:text-blue-800 font-medium">Review</a>
                        </td>
                    </tr>
                `;
                }).join('');
            }

            const totalPages = data.totalPages ?? 0;
            const number = data.number ?? 0;
            const totalElements = data.totalElements ?? 0;
            document.getElementById('pageInfo').textContent =
                totalElements === 0 ? '' : `Page ${number + 1} of ${totalPages} (${totalElements} document${totalElements === 1 ? '' : 's'})`;
            document.getElementById('prevBtn').disabled = number <= 0;
            document.getElementById('nextBtn').disabled = number >= totalPages - 1;
        }

        function statusClass(status) {
            switch (status) {
                case 'AUTO_APPROVED': return 'bg-emerald-100 text-emerald-800';
                case 'APPROVED': return 'bg-green-100 text-green-800';
                case 'REVIEW_REQUIRED': return 'bg-yellow-100 text-yellow-800';
                case 'AUDIT_REQUIRED': return 'bg-amber-100 text-amber-800';
                case 'PENDING': return 'bg-blue-100 text-blue-800';
                case 'REJECTED':
                case 'FAILED': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', async () => {
            updateSortIndicators();
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const field = th.dataset.sort;
                    if (currentSort === field) {
                        currentDir = currentDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort = field;
                        currentDir = SORT_DEFAULT_DIR[field] || 'asc';
                    }
                    updateSortIndicators();
                    currentPage = 0;
                    loadQueue(currentPage);
                });
            });

            await loadBatches();
            loadQueue(currentPage);

            document.getElementById('refreshBtn').addEventListener('click', () => loadQueue(currentPage));
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    loadQueue(currentPage);
                }
            });
            document.getElementById('nextBtn').addEventListener('click', () => {
                currentPage++;
                loadQueue(currentPage);
            });
            const onFilterChange = () => {
                currentPage = 0;
                loadQueue(currentPage);
            };
            document.getElementById('batchFilter').addEventListener('change', onFilterChange);
            document.getElementById('statusFilter').addEventListener('change', onFilterChange);
            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                document.getElementById('batchFilter').value = '';
                document.getElementById('statusFilter').value = '';
                onFilterChange();
            });
            const myGroupsCb = document.getElementById('myGroupsOnlyCb');
            if (myGroupsCb) {
                myGroupsCb.addEventListener('change', async () => {
                    document.getElementById('batchFilter').value = '';
                    currentPage = 0;
                    await loadBatches();
                    loadQueue(currentPage);
                });
            }
        });
    </script>
</body>
</html>
