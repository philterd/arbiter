services:

  arbiter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiter-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/arbiter
      - ARBITER_OPENSEARCH_ENDPOINT=http://opensearch:9200
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_SESSION_STORE_TYPE=redis
      # AES-256 key for at-rest credential encryption — base64 of exactly 32
      # random bytes. The application refuses to start without it. Generate one
      # and place it in .env (next to this file):
      #
      # echo "ARBITER_CRYPTO_SECRET=$(openssl rand -base64 32)" >> .env
      - ARBITER_CRYPTO_SECRET=${ARBITER_CRYPTO_SECRET:?Set ARBITER_CRYPTO_SECRET in .env (see .env.example)}
      # Initial password for the bootstrap admin (admin@philterd.ai). Used only
      # when no admin account yet exists in the database. Must
      # be at least 12 characters; if blank or too short, Arbiter generates a
      # random password and prints it to stdout instead.
      - ARBITER_ADMIN_INITIAL_PASSWORD=ChangeMeOnFirstLogin!

    volumes:
      - ./sample-files:/app/sample-files:ro
      # Test fixture for the Local Directory data source. Configure a Local
      # Directory source in the admin UI with directory path /app/local-files
      # to ingest the files in ./local-files. Mounted read-only so the
      # container can never modify the host directory.
      - ./local-files:/app/local-files:ro
      # Test fixture for the Local Directory destination. The DemoDataSourceLoader
      # registers an "output" destination pointing at /app/output, which maps to
      # the host's /tmp so finalized exports land somewhere easy to inspect.
      # Mounted read-write so the application can actually write export files.
      - /tmp:/app/output
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - arbiter

  valkey:
    image: valkey/valkey:8-alpine
    container_name: arbiter-valkey
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - arbiter

  mongodb:
    image: mongo:latest
    container_name: arbiter-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arbiter

  policy-editor:
    image: philterd/philterd-redaction-policy-editor:latest
    container_name: arbiter-policy-editor
    ports:
      - "8081:8080"
    networks:
      - arbiter

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: arbiter-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - arbiter

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: arbiter-elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
      - "xpack.security.enrollment.enabled=false"
      - "xpack.security.http.ssl.enabled=false"
      - "xpack.security.transport.ssl.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - arbiter

  # S3-compatible object storage for the demo S3 data source. The DemoDataSourceLoader
  # registers a "Demo MinIO (S3-compatible)" data source that points at this service.
  # Default root credentials are minioadmin / minioadmin — fine for the demo, but
  # change them for any non-demo deployment (and update the loader's @Value defaults
  # to match, or supply ARBITER_DEMO_DATA_MINIO_ACCESS_KEY / _SECRET_KEY env vars).
  minio:
    image: minio/minio:latest
    container_name: arbiter-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - arbiter

  # One-shot bootstrap that waits for MinIO to become ready, creates the
  # "arbiter-demo" bucket, and seeds it with the bundled sample files. Exits 0
  # when done; Docker keeps the exited container around so the work isn't redone
  # on subsequent `docker compose up` calls (the bucket already exists, mc cp
  # is idempotent for the file overwrite path).
  minio-init:
    image: minio/mc:latest
    container_name: arbiter-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./sample-files:/sample-files:ro
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/arbiter-demo &&
        mc cp --recursive /sample-files/. local/arbiter-demo/ &&
        echo 'Seeded arbiter-demo bucket from /sample-files.'
      "
    networks:
      - arbiter

networks:
  arbiter:
    driver: bridge