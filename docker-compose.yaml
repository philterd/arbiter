services:

  philter-workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: philter-workspace-app
    ports:
      # PHILTER_WORKSPACE_PORT changes the host port, for example when 8080 is taken.
      - "${PHILTER_WORKSPACE_PORT:-8080}:8080"
    healthcheck:
      # Ready once GET /api/health answers 200 (it answers 503 while a dependency is down). The
      # start period covers a cold start, including creating the database schema and, here,
      # loading the demo data.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:$${SERVER_PORT:-8080}/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    environment:
      # Database: SQLite, in the philter-workspace-data volume. To use MongoDB instead:
      #
      # PHILTER_WORKSPACE_STORE=mongodb docker compose --profile mongodb up
      - PHILTER_WORKSPACE_STORE=${PHILTER_WORKSPACE_STORE:-sqlite}
      - PHILTER_WORKSPACE_SQLITE_PATH=/app/data/philter-workspace.db
      # Full-text search (off until an administrator turns it on): the embedded, encrypted index in the
      # philter-workspace-data volume. To use OpenSearch instead:
      #
      # PHILTER_WORKSPACE_SEARCH_BACKEND=opensearch docker compose --profile opensearch up
      - PHILTER_WORKSPACE_SEARCH_BACKEND=${PHILTER_WORKSPACE_SEARCH_BACKEND:-embedded}
      - PHILTER_WORKSPACE_SEARCH_INDEX_DIR=/app/data/search-index
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/philter-workspace
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      # AES-256 key for at-rest credential encryption — base64 of exactly 32
      # random bytes. The application refuses to start without it. Generate one
      # and place it in .env (next to this file):
      #
      # echo "PHILTER_WORKSPACE_CRYPTO_SECRET=$(openssl rand -base64 32)" >> .env
      - PHILTER_WORKSPACE_CRYPTO_SECRET=${PHILTER_WORKSPACE_CRYPTO_SECRET:?Set PHILTER_WORKSPACE_CRYPTO_SECRET in .env (see .env.example)}
      # The dev compose explicitly opts in to demo-data loading (R2-F4). The
      # default in application.properties is now off — production deployments
      # should never load synthetic data, but the dev stack benefits from it.
      - PHILTER_WORKSPACE_DEMO_DATA_ENABLED=true
      # This stack serves plain HTTP, and a browser drops a Secure cookie over HTTP except from localhost, so
      # signing in from another address or from Safari would fail. A deployment keeps Secure cookies behind
      # HTTPS (see docker-compose.prod.yaml).
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=false
      # Philter Workspace's one Philter, for sign-in, policies, and redaction. For development the
      # key is Philter's bootstrap key, which belongs to an administrator, so Admin → Philter
      # flags it. A deployment uses a key for a user who is not an administrator (see
      # docker-compose.prod.yaml).
      - PHILTER_WORKSPACE_PHILTER_URL=http://philter:8080
      - PHILTER_WORKSPACE_PHILTER_API_KEY=${PHILTER_BOOTSTRAP_API_KEY:-sk_devonlydevonlydevonlydevonly0000}

    volumes:
      - ./sample-files:/app/sample-files:ro
      # Test fixture for the Local Directory data source. Configure a Local
      # Directory source in the admin UI with directory path /app/local-files
      # to ingest the files in ./local-files. Mounted read-only so the
      # container can never modify the host directory.
      - ./local-files:/app/local-files:ro
      # Test fixture for the Local Directory destination. The DemoDataSourceLoader
      # registers an "output" destination pointing at /app/output, which maps to
      # the host's /tmp so finalized exports land somewhere easy to inspect.
      # Mounted read-write so the application can actually write export files.
      - /tmp:/app/output
      # The SQLite database, kept across container rebuilds.
      - philter-workspace-data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
        # Only started with --profile mongodb.
        required: false
      opensearch:
        condition: service_healthy
        # Only started with --profile opensearch.
        required: false
      elasticsearch:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      philter:
        condition: service_started
    networks:
      - philter-workspace

  philter:
    image: philterd/philter:${PHILTER_VERSION:-4.0.0}
    container_name: philter-workspace-philter
    environment:
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/opt/philter/data/philter.db
      # Development-only values. Set your own in .env for anything else.
      - PHILTER_ENCRYPTION_KEY=${PHILTER_ENCRYPTION_KEY:-ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktMDAwMDA=}
      - PHILTER_BOOTSTRAP_API_KEY=${PHILTER_BOOTSTRAP_API_KEY:-sk_devonlydevonlydevonlydevonly0000}
      # People sign in to Philter Workspace through Philter.
      - PASSWORD_SIGN_IN_ENABLED=true
      - SSL_ENABLED=false
    volumes:
      - philter-data:/opt/philter/data
    networks:
      - philter-workspace

  valkey:
    image: valkey/valkey:8-alpine
    container_name: philter-workspace-valkey
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - philter-workspace

  mongodb:
    image: mongo:latest
    container_name: philter-workspace-mongodb
    profiles: ["mongodb"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - philter-workspace

  policy-editor:
    image: philterd/philterd-redaction-policy-editor:latest
    container_name: philter-workspace-policy-editor
    ports:
      - "${POLICY_EDITOR_PORT:-8081}:8080"
    networks:
      - philter-workspace

  # Optional: the OpenSearch full-text backend, and the demo OpenSearch data source. Started with
  # --profile opensearch; the default embedded backend needs no search service.
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: philter-workspace-opensearch
    profiles: ["opensearch"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - philter-workspace

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: philter-workspace-elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
      - "xpack.security.enrollment.enabled=false"
      - "xpack.security.http.ssl.enabled=false"
      - "xpack.security.transport.ssl.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - philter-workspace

  # S3-compatible object storage for the demo S3 data source.
  minio:
    image: minio/minio:latest
    container_name: philter-workspace-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - philter-workspace

  # One-shot bootstrap that waits for MinIO to become ready, creates the
  # "philter-workspace-demo" bucket, and seeds it with the bundled sample files.
  minio-init:
    image: minio/mc:latest
    container_name: philter-workspace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./sample-files:/sample-files:ro
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/philter-workspace-demo &&
        mc mirror --overwrite /sample-files/ local/philter-workspace-demo/philter-workspace-demo/ &&
        echo 'Seeded philter-workspace-demo bucket from /sample-files (under philter-workspace-demo/ prefix).'
      "
    networks:
      - philter-workspace

  # Lightweight PostgreSQL for the demo Relational Database data source.
  # First-boot initialisation runs every .sql file under
  # /docker-entrypoint-initdb.d/, so init-postgres.sql creates the
  # `documents(filename, text)` table and inserts synthetic PII rows.
  # DemoDataSourceLoader registers a matching "Demo PostgreSQL" data source
  # whose SQL query reads from that table.
  postgres:
    image: postgres:16-alpine
    container_name: philter-workspace-postgres
    environment:
      - POSTGRES_USER=philter_workspace_demo
      - POSTGRES_PASSWORD=philter_workspace_demo
      - POSTGRES_DB=philter_workspace_demo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-documents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philter_workspace_demo -d philter_workspace_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - philter-workspace

networks:
  philter-workspace:
    driver: bridge

volumes:
  philter-workspace-data:
  philter-data:
