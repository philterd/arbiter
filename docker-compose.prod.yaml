# Philter Workspace and Philter for a single host, both storing their data in SQLite.
#
# Before the first start, put these in .env next to this file (see .env.example):
#   PHILTER_WORKSPACE_CRYPTO_SECRET, PHILTER_ENCRYPTION_KEY, PHILTER_BOOTSTRAP_API_KEY, VALKEY_PASSWORD
#
# Philter Workspace needs an API key for a Philter user who is not an administrator, with only the
# redact and policies:read scopes, so start Philter first and create one:
#
#   docker compose -f docker-compose.prod.yaml up -d philter
#
# Create the user and key with PHILTER_BOOTSTRAP_API_KEY as docs/docs/workflow.md
# ("Philter API key for Philter Workspace") shows, and put the key in .env as
# PHILTER_WORKSPACE_PHILTER_API_KEY. That user owns the policies and contexts Philter Workspace uses.
# Then start the rest:
#
#   docker compose -f docker-compose.prod.yaml up -d
#
# People sign in to Philter Workspace through Philter. To sign in as Philter's first administrator,
# "admin", give it a password with PHILTER_BOOTSTRAP_API_KEY, as docs/docs/security.md
# ("First sign-in") shows; it is an administrator in Philter Workspace too.
#
# Each SQLite database lives in a volume (philter-workspace-data, philter-data). Back them up;
# see docs/docs/reference/database.md#backups.
services:

  philter-workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: philter-workspace-app
    restart: unless-stopped
    healthcheck:
      # Ready once GET /api/health answers 200 (it answers 503 while a dependency is down). The
      # start period covers a cold start, including creating the database schema.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:$${SERVER_PORT:-8080}/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Session cookies are Secure-only, so serve Philter Workspace to users through a reverse proxy
    # or load balancer that terminates HTTPS.
    ports:
      - "8080:8080"
    environment:
      - PHILTER_WORKSPACE_STORE=sqlite
      - PHILTER_WORKSPACE_SQLITE_PATH=/app/data/philter-workspace.db
      # Full-text search, off until an administrator turns it on: the embedded, encrypted index, in the
      # philter-workspace-data volume. See the full text search docs to use OpenSearch instead.
      - PHILTER_WORKSPACE_SEARCH_BACKEND=${PHILTER_WORKSPACE_SEARCH_BACKEND:-embedded}
      - PHILTER_WORKSPACE_SEARCH_INDEX_DIR=/app/data/search-index
      - PHILTER_WORKSPACE_CRYPTO_SECRET=${PHILTER_WORKSPACE_CRYPTO_SECRET:?Set PHILTER_WORKSPACE_CRYPTO_SECRET in .env (openssl rand -base64 32)}
      - PHILTER_WORKSPACE_DEMO_DATA_ENABLED=false
      # Philter Workspace's one Philter, for sign-in, policies, and redaction.
      - PHILTER_WORKSPACE_PHILTER_URL=http://philter:8080
      # Not required here, so Philter can be started alone first; Philter Workspace refuses to start without it.
      - PHILTER_WORKSPACE_PHILTER_API_KEY=${PHILTER_WORKSPACE_PHILTER_API_KEY:-}
      # Philter Workspace refuses private-network hosts unless they are listed. Listing hosts also
      # refuses public ones not listed, unless that check is relaxed under Admin → Security.
      # Add your data sources and destinations here, comma-separated.
      - PHILTER_WORKSPACE_DATA_SOURCES_ALLOWED_HOSTS=${PHILTER_WORKSPACE_DATA_SOURCES_ALLOWED_HOSTS:-philter}
      # Sessions.
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
      # Mutual TLS to Philter, when Philter (or a proxy in front of it) serves HTTPS and
      # requires a client certificate. Uncomment these and the ./certs volume below, and set
      # PHILTER_WORKSPACE_PHILTER_URL to https://<host matching Philter's certificate>:8080.
      # - PHILTER_WORKSPACE_PHILTER_TLS_KEY_STORE=/app/certs/philter-workspace-client.p12
      # - PHILTER_WORKSPACE_PHILTER_TLS_KEY_STORE_PASSWORD=${PHILTER_WORKSPACE_PHILTER_TLS_KEY_STORE_PASSWORD}
      # - PHILTER_WORKSPACE_PHILTER_TLS_TRUST_STORE=/app/certs/philter-ca.p12
      # - PHILTER_WORKSPACE_PHILTER_TLS_TRUST_STORE_PASSWORD=${PHILTER_WORKSPACE_PHILTER_TLS_TRUST_STORE_PASSWORD}
    volumes:
      - philter-workspace-data:/app/data
      # - ./certs:/app/certs:ro
    depends_on:
      valkey:
        condition: service_healthy
      philter:
        condition: service_started
    networks:
      - philter-workspace

  philter:
    image: philterd/philter:${PHILTER_VERSION:-4.0.0}
    container_name: philter-workspace-philter
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/opt/philter/data/philter.db
      # Encrypts Philter's stored data. Changing it later makes existing data unreadable.
      - PHILTER_ENCRYPTION_KEY=${PHILTER_ENCRYPTION_KEY:?Set PHILTER_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # The Philter admin's first API key: sk_ followed by 32 letters and digits.
      - PHILTER_BOOTSTRAP_API_KEY=${PHILTER_BOOTSTRAP_API_KEY:?Set PHILTER_BOOTSTRAP_API_KEY in .env}
      # People sign in to Philter Workspace with their Philter username and password.
      - PASSWORD_SIGN_IN_ENABLED=true
      # Plain HTTP: Philter publishes no port and is reachable only by Philter Workspace on the
      # philter-workspace network. For HTTPS, set this to true, mount Philter's own certificate
      # (see Philter's TLS settings), and give Philter Workspace a trust store for it above.
      - SSL_ENABLED=false
      # Names are found by the PhEye model in Philter's image (ph-eye-pii-en-small), which
      # Philter's default policy uses, so no separate PhEye service is needed. To use one,
      # set PHEYE_ENDPOINT and name it in a policy.
    volumes:
      - philter-data:/opt/philter/data
    networks:
      - philter-workspace

  valkey:
    image: valkey/valkey:8-alpine
    container_name: philter-workspace-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}"]
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - philter-workspace

networks:
  philter-workspace:
    driver: bridge

volumes:
  philter-workspace-data:
  philter-data:
