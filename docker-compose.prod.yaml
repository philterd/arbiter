# Arbiter and Philter for a single host, both storing their data in SQLite.
#
# Before the first start, put these in .env next to this file (see .env.example):
#   ARBITER_CRYPTO_SECRET, PHILTER_ENCRYPTION_KEY, PHILTER_BOOTSTRAP_API_KEY, VALKEY_PASSWORD
#
# Arbiter needs an API key for a Philter user who is not an administrator, with only the
# redact and policies:read scopes, so start Philter first and create one:
#
#   docker compose -f docker-compose.prod.yaml up -d philter
#
# Create the user and key with PHILTER_BOOTSTRAP_API_KEY as docs/docs/workflow.md
# ("Philter API key for Arbiter") shows, and put the key in .env as
# ARBITER_PHILTER_API_KEY. That user owns the policies and contexts Arbiter uses.
# Then start the rest:
#
#   docker compose -f docker-compose.prod.yaml up -d
#
# People sign in to Arbiter through Philter. To sign in as Philter's first administrator,
# "admin", give it a password with PHILTER_BOOTSTRAP_API_KEY, as docs/docs/security.md
# ("First sign-in") shows; it is an administrator in Arbiter too.
#
# Each SQLite database lives in a volume (arbiter-data, philter-data). Back them up;
# see docs/docs/reference/database.md#backups.
services:

  arbiter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiter-app
    restart: unless-stopped
    # Session cookies are Secure-only, so serve Arbiter to users through a reverse proxy
    # or load balancer that terminates HTTPS.
    ports:
      - "8080:8080"
    environment:
      - ARBITER_STORE=sqlite
      - ARBITER_SQLITE_PATH=/app/data/arbiter.db
      - ARBITER_CRYPTO_SECRET=${ARBITER_CRYPTO_SECRET:?Set ARBITER_CRYPTO_SECRET in .env (openssl rand -base64 32)}
      - ARBITER_DEMO_DATA_ENABLED=false
      # Arbiter's one Philter, for sign-in, policies, and redaction.
      - ARBITER_PHILTER_URL=http://philter:8080
      # Not required here, so Philter can be started alone first; Arbiter refuses to start without it.
      - ARBITER_PHILTER_API_KEY=${ARBITER_PHILTER_API_KEY:-}
      # Arbiter refuses private-network hosts unless they are listed. Listing hosts also
      # refuses public ones not listed, unless that check is relaxed under Admin → Security.
      # Add your data sources and destinations here, comma-separated.
      - ARBITER_DATA_SOURCES_ALLOWED_HOSTS=${ARBITER_DATA_SOURCES_ALLOWED_HOSTS:-philter}
      # Sessions.
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
      # Mutual TLS to Philter, when Philter (or a proxy in front of it) serves HTTPS and
      # requires a client certificate. Uncomment these and the ./certs volume below, and set
      # ARBITER_PHILTER_URL to https://<host matching Philter's certificate>:8080.
      # - ARBITER_PHILTER_TLS_KEY_STORE=/app/certs/arbiter-client.p12
      # - ARBITER_PHILTER_TLS_KEY_STORE_PASSWORD=${ARBITER_PHILTER_TLS_KEY_STORE_PASSWORD}
      # - ARBITER_PHILTER_TLS_TRUST_STORE=/app/certs/philter-ca.p12
      # - ARBITER_PHILTER_TLS_TRUST_STORE_PASSWORD=${ARBITER_PHILTER_TLS_TRUST_STORE_PASSWORD}
    volumes:
      - arbiter-data:/app/data
      # - ./certs:/app/certs:ro
    depends_on:
      valkey:
        condition: service_healthy
      philter:
        condition: service_started
    networks:
      - arbiter

  philter:
    image: philterd/philter:${PHILTER_VERSION:-4.0.0}
    container_name: arbiter-philter
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/opt/philter/data/philter.db
      # Encrypts Philter's stored data. Changing it later makes existing data unreadable.
      - PHILTER_ENCRYPTION_KEY=${PHILTER_ENCRYPTION_KEY:?Set PHILTER_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # The Philter admin's first API key: sk_ followed by 32 letters and digits.
      - PHILTER_BOOTSTRAP_API_KEY=${PHILTER_BOOTSTRAP_API_KEY:?Set PHILTER_BOOTSTRAP_API_KEY in .env}
      # People sign in to Arbiter with their Philter username and password.
      - PASSWORD_SIGN_IN_ENABLED=true
      # Plain HTTP: Philter publishes no port and is reachable only by Arbiter on the
      # arbiter network. For HTTPS, set this to true, mount Philter's own certificate
      # (see Philter's TLS settings), and give Arbiter a trust store for it above.
      - SSL_ENABLED=false
      # Names are found by the PhEye model in Philter's image (ph-eye-pii-en-small), which
      # Philter's default policy uses, so no separate PhEye service is needed. To use one,
      # set PHEYE_ENDPOINT and name it in a policy.
    volumes:
      - philter-data:/opt/philter/data
    networks:
      - arbiter

  valkey:
    image: valkey/valkey:8-alpine
    container_name: arbiter-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}"]
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arbiter

networks:
  arbiter:
    driver: bridge

volumes:
  arbiter-data:
  philter-data:
